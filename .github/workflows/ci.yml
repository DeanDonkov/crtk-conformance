name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e .[dev]
      - run: python -m pytest -q tests/test_geometry.py tests/test_stats.py tests/test_thresholds.py tests/test_report.py tests/test_rate_estimator.py tests/test_expectations.py
  integration-ros1:
    # ROS Noetic on Ubuntu 20.04 / Python 3.8, the same distribution and interpreter as the validation container
    # (validation/environment/, which builds Noetic from source because the archive host could not reach packages.ros.org).
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          apt-get update && apt-get install -y python3-pip git ros-noetic-geometry-msgs ros-noetic-sensor-msgs ros-noetic-tf2-msgs
          git clone https://github.com/collaborative-robotics/crtk_msgs /tmp/crtk_msgs && git -C /tmp/crtk_msgs checkout 14b04fcf0d5f3fe32d2b4d0dddd3d247a60e37c3
          pip3 install "numpy==1.24.4" "scipy==1.10.1" "jsonschema==4.17.3" "PyYAML==6.0.1" "pytest==7.4.4" "pytest-timeout==2.3.1"
      - name: build crtk_msgs
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          mkdir -p /tmp/ws/src && cp -r /tmp/crtk_msgs /tmp/ws/src/ && cd /tmp/ws && catkin_make
      - name: test
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash && source /tmp/ws/devel/setup.bash
          export ROS_IP=127.0.0.1 ROS_HOSTNAME=localhost PYTHONPATH=$PWD/src:$PYTHONPATH
          python3 -m pytest -q -p no:cacheprovider
