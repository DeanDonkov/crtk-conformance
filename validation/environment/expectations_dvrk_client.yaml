# A client authored against a dVRK with the JHU PSM2 base_frame (ledger P19): measured_cp = base_frame * local,
# base_frame = rotation of -150 deg about x (rows [1,0,0],[0,-0.866,0.5],[0,-0.5,-0.866]), translation 0.20 m along x;
# SI units; operating-state machine required; last goal held when commands stop.
spatial:
  mode: expected_transform
  translation_m: [0.20, 0.0, 0.0]
  quaternion_xyzw: [-0.9659258262890683, 0.0, 0.0, 0.25881904510252074]
dimensional:
  mode: si
  expected_unit_m: 1.0
temporal:
  state_machine: required
  stop_behaviour: hold
  rate: required
