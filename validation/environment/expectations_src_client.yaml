# A client authored against the SRC convention (paper Sec. 4): arm-base (identity) binding of the unqualified
# topics, SI units assumed, no operating-state machine, last setpoint held when commands stop, and a rate
# requirement at the client's declared rate.
spatial:
  mode: identity
dimensional:
  mode: si
  expected_unit_m: 1.0
temporal:
  state_machine: forbidden
  stop_behaviour: hold
  rate: required
